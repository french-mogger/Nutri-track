let state = { user:null, email:null, data:null, booting:true, view:'dashboard', toast:null, modal:null, scan:{status:'idle',result:null,file:null}, authMode:'login', authErr:'', authNotice:'', authBusy:false };

function showToast(msg){ state.toast=msg; render(); setTimeout(()=>{ state.toast=null; render(); },2200); }
function mapAuthError(error){
  const msg=(error&&error.message)||'';
  if(/already registered|already exists/i.test(msg)) return t('signupError');
  if(/invalid login credentials/i.test(msg)) return t('loginError');
  return msg || t('errorGeneric');
}

/* ---------- auth ---------- */
async function loadUserData(){
  const [pRes,mRes,wRes] = await Promise.all([
    sb.from('profiles').select('*').eq('id',state.user).maybeSingle(),
    sb.from('meals').select('*').eq('user_id',state.user).order('date',{ascending:false}),
    sb.from('weights').select('*').eq('user_id',state.user).order('date',{ascending:true})
  ]);
  const p=pRes.data||{};
  state.data={
    profile:{ name:p.name||state.email, goals:{cal:p.cal_goal??2000,protein:p.protein_goal??150,carbs:p.carbs_goal??200,fat:p.fat_goal??65}, startWeight:p.start_weight, targetWeight:p.target_weight },
    meals: mRes.data||[],
    weights: wRes.data||[]
  };
}
async function afterAuth(user){
  state.user=user.id; state.email=user.email;
  await loadUserData();
  state.view='dashboard'; state.authErr=''; state.authNotice=''; state.authBusy=false; render();
}
async function doLogin(email,p){
  state.authBusy=true; render();
  const {data,error} = await sb.auth.signInWithPassword({email,password:p});
  if(error){ state.authErr=mapAuthError(error); state.authBusy=false; render(); return; }
  await afterAuth(data.user);
}
async function doSignup(email,p,name){
  state.authBusy=true; render();
  const {data,error} = await sb.auth.signUp({email,password:p,options:{data:{name}}});
  if(error){ state.authErr=mapAuthError(error); state.authBusy=false; render(); return; }
  if(data.user && !data.session){ state.authBusy=false; state.authNotice=t('checkEmail'); render(); return; }
  await afterAuth(data.user);
}
async function doLogout(){ if(sb) await sb.auth.signOut(); state.user=null; state.email=null; state.data=null; state.view='dashboard'; render(); }

/* ---------- CRUD: meals (optimistic, with rollback on failure) ---------- */
async function addMeal(m){
  const tempId='tmp_'+uid(); const optimistic={...m,id:tempId};
  state.data.meals.unshift(optimistic); state.modal=null; render(); showToast(t('addedToast'));
  const {data,error} = await sb.from('meals').insert({user_id:state.user,name:m.name,type:m.type,cal:m.cal,protein:m.protein,carbs:m.carbs,fat:m.fat,date:m.date,time:m.time}).select().single();
  const idx=state.data.meals.findIndex(x=>x.id===tempId);
  if(error){ if(idx>-1) state.data.meals.splice(idx,1); showToast(t('errorGeneric')); }
  else if(idx>-1){ state.data.meals[idx]=data; }
  render();
}
async function updateMeal(id,patch){
  const prev = state.data.meals.find(m=>m.id===id);
  state.data.meals = state.data.meals.map(m=>m.id===id?{...m,...patch}:m);
  state.modal=null; render(); showToast(t('updatedToast'));
  const {error} = await sb.from('meals').update(patch).eq('id',id);
  if(error){ state.data.meals = state.data.meals.map(m=>m.id===id?prev:m); render(); showToast(t('errorGeneric')); }
}
async function deleteMeal(id){
  const prevList = state.data.meals;
  state.data.meals = state.data.meals.filter(m=>m.id!==id);
  state.modal=null; render(); showToast(t('deletedToast'));
  const {error} = await sb.from('meals').delete().eq('id',id);
  if(error){ state.data.meals = prevList; render(); showToast(t('errorGeneric')); }
}
async function addWeight(kg,date){
  const tempId='tmp_'+uid(); const optimistic={id:tempId,date,kg:parseFloat(kg)};
  state.data.weights=[...state.data.weights,optimistic].sort((a,b)=>a.date<b.date?-1:1);
  state.modal=null; render(); showToast(t('weightAddedToast'));
  const {data,error} = await sb.from('weights').insert({user_id:state.user,date,kg:parseFloat(kg)}).select().single();
  if(error){ state.data.weights = state.data.weights.filter(w=>w.id!==tempId); }
  else { state.data.weights = state.data.weights.map(w=>w.id===tempId?data:w); }
  render();
}
async function saveGoals(g){
  const prev = profile().goals;
  state.data.profile.goals=g; render(); showToast(t('goalsSaved'));
  const {error} = await sb.from('profiles').update({cal_goal:g.cal,protein_goal:g.protein,carbs_goal:g.carbs,fat_goal:g.fat}).eq('id',state.user);
  if(error){ state.data.profile.goals=prev; render(); showToast(t('errorGeneric')); }
}
async function seedDemoData(){
  showToast(t('seeding'));
  const foods=[
    ['breakfast','Greek yogurt & berries',260,20,28,6],['breakfast','Oatmeal with banana',340,10,58,7],['breakfast','Avocado toast & eggs',420,18,32,24],
    ['lunch','Grilled chicken salad',480,42,20,22],['lunch','Salmon poke bowl',560,32,60,18],['lunch','Turkey wrap',510,28,48,20],
    ['dinner','Beef stir-fry with rice',620,38,55,24],['dinner','Baked cod & vegetables',390,36,20,14],['dinner','Veggie pasta',540,18,78,16],
    ['snack','Almonds (30g)',180,6,6,15],['snack','Protein shake',220,25,15,5],['snack','Apple & peanut butter',210,6,22,12]
  ];
  let inserts=[];
  for(let d=6; d>=0; d--){
    const date=daysAgo(d);
    const picks=[foods[Math.floor(Math.random()*3)],foods[3+Math.floor(Math.random()*3)],foods[6+Math.floor(Math.random()*3)]];
    if(Math.random()>0.4) picks.push(foods[9+Math.floor(Math.random()*3)]);
    picks.forEach(f=>inserts.push({user_id:state.user,type:f[0],name:f[1],cal:f[2],protein:f[3],carbs:f[4],fat:f[5],date,
      time:f[0]==='breakfast'?'08:1'+Math.floor(Math.random()*9):f[0]==='lunch'?'13:'+(10+Math.floor(Math.random()*40)):f[0]==='dinner'?'19:'+(10+Math.floor(Math.random()*40)):'16:'+(10+Math.floor(Math.random()*40))}));
  }
  await sb.from('meals').insert(inserts);
  let weightsArr=[]; let w=82;
  for(let d=27; d>=0; d-=3){ w-=(0.15+Math.random()*0.25); weightsArr.push({user_id:state.user,date:daysAgo(d),kg:Math.round(w*10)/10}); }
  await sb.from('weights').insert(weightsArr);
  await loadUserData(); showToast(t('seeded')); render();
}

/* ---------- render root ---------- */
function render(){
  const app=document.getElementById('app');
  if(state.booting){ app.innerHTML=`<div class="min-h-screen flex items-center justify-center"><div class="w-8 h-8 border-2 border-emerald-400 border-t-transparent rounded-full spin"></div></div>`; return; }
  if(!CONFIGURED){ app.innerHTML=setupScreen(); return; }
  app.innerHTML = state.user ? appShell() : authScreen();
  const fi=document.getElementById('scanFileInput');
  if(fi) fi.onchange = handleFileSelect;
}
function setupScreen(){
  return `<div class="min-h-screen flex items-center justify-center p-6"><div class="max-w-md bg-white border border-amber-200 rounded-2xl p-6 text-center">
    <div class="text-3xl mb-2">🛠️</div>
    <h1 class="font-bold text-lg mb-2">${t('setupTitle')}</h1>
    <p class="text-sm text-slate-500">${t('setupDesc')}</p>
  </div></div>`;
}

function pageDashboard(){
  const g=profile().goals; const list=meals().filter(m=>m.date===todayStr());

  const cal=sum('cal'), pro=sum('protein'), carb=sum('carbs'), fat=sum('fat');

  const remaining=Math.max(0,g.cal-cal);

        <div class="space-y-1 text-sm">
          <div class="flex justify-between gap-6"><span class="text-slate-400">${t('consumed')}</span><span class="font-semibold">${cal} ${t('kcal')}</span></div>
          <div class="flex justify-between gap-6"><span class="text-slate-400">${t('goal')}</span><span class="font-semibold">${g.cal} ${t('kcal')}</span></div>

      <div class="bg-white rounded-2xl border border-slate-100 p-6 lg:col-span-2 space-y-4">

function resetScan(){ state.scan={status:'idle',result:null,file:null}; render(); }
function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result.split(',')[1]);
    r.onerror=()=>rej(new Error('read failed'));
    r.readAsDataURL(file);
  });
}
async function handleFileSelect(ev){
  const file=ev.target.files[0]; if(!file) return;
  const preview=URL.createObjectURL(file);
  state.scan={status:'analyzing',preview,result:null};
  render();
  try{
    const b64 = await fileToBase64(file);
    const {data,error} = await sb.functions.invoke('analyze-meal',{body:{image:b64,mediaType:file.type,lang:LANG}});
    if(error || !data || data.error) throw new Error((data&&data.error)||(error&&error.message)||'analysis failed');
    state.scan={status:'result',preview,result:data};
  }catch(e){
    state.scan={status:'unavailable',preview,result:{name:'',type:'lunch',cal:'',protein:'',carbs:'',fat:''}};
  }
  render();
}
function submitScanResult(ev){
  ev.preventDefault(); const f=ev.target;
  addMeal({name:f.name.value.trim(),type:f.type.value,cal:+f.cal.value||0,protein:+f.protein.value||0,carbs:+f.carbs.value||0,fat:+f.fat.value||0,date:todayStr(),time:new Date().toTimeString().slice(0,5)});
  resetScan();
  return false;
}

    <div class="bg-white rounded-2xl border border-slate-100 p-6">
      <h2 class="font-semibold text-slate-800 mb-1">${t('demoData')}</h2>
      <p class="text-sm text-slate-400 mb-3">${t('demoDataDesc')}</p>
      <button onclick="seedDemoData()" class="border border-emerald-200 text-emerald-700 rounded-xl px-4 py-2 text-sm font-medium hover:bg-emerald-50">${t('loadDemo')}</button>
    </div>
  </div>`;
}
async function submitSettings(ev){
  ev.preventDefault(); const f=ev.target;
  const name=f.name.value.trim()||state.email;
  const startWeight=f.startWeight.value?+f.startWeight.value:null;
  const targetWeight=f.targetWeight.value?+f.targetWeight.value:null;
  state.data.profile={...state.data.profile,name,startWeight,targetWeight};
  showToast(t('settingsSaved')); render();
  const {error} = await sb.from('profiles').update({name,start_weight:startWeight,target_weight:targetWeight}).eq('id',state.user);
  if(error) showToast(t('errorGeneric'));
  return false;
}

/* ---------- Modal ---------- */
function modalHtml(){
  const m=state.modal;
  if(m.type==='confirmDelete'){
    return `<div class="fixed inset-0 modal-bg flex items-center justify-center z-40 p-4" onclick="if(event.target===this) closeModal()">
      <div class="bg-white rounded-2xl p-6 w-full max-w-sm fade">
        <p class="text-slate-700 mb-5">${t('confirmDelete')}</p>
        <div class="flex gap-2"><button onclick="closeModal()" class="flex-1 border border-slate-200 rounded-xl py-2.5 text-sm font-medium">${t('cancel')}</button>
        <button onclick="deleteMeal('${m.id}')" class="flex-1 bg-red-500 text-white rounded-xl py-2.5 text-sm font-semibold">${t('yes')}</button></div>
      </div></div>`;
  }
  if(m.type==='weight'){
    return `<div class="fixed inset-0 modal-bg flex items-center justify-center z-40 p-4" onclick="if(event.target===this) closeModal()">
      <div class="bg-white rounded-2xl p-6 w-full max-w-sm fade">
        <h3 class="font-semibold mb-4">${t('addWeight')}</h3>
        <form onsubmit="return submitWeight(event)" class="space-y-3">
          <input name="kg" type="number" step="0.1" placeholder="${t('weightKg')}" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm" required>
          <input name="date" type="date" value="${todayStr()}" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm" required>
          <div class="flex gap-2 pt-1"><button type="button" onclick="closeModal()" class="flex-1 border border-slate-200 rounded-xl py-2.5 text-sm font-medium">${t('cancel')}</button>
          <button class="flex-1 bg-emerald-500 text-white rounded-xl py-2.5 text-sm font-semibold">${t('save')}</button></div>
        </form>
      </div></div>`;
  }
  const d=m.data;
  return `<div class="fixed inset-0 modal-bg flex items-center justify-center z-40 p-4" onclick="if(event.target===this) closeModal()">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm fade">
      <h3 class="font-semibold mb-4">${d?t('editMeal'):t('addMeal')}</h3>
      <form onsubmit="return submitMealForm(event)" class="space-y-3">
        <input name="name" value="${d?esc(d.name):''}" placeholder="${t('mealName')}" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm" required>
        <select name="type" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm">${['breakfast','lunch','dinner','snack'].map(ty=>`<option value="${ty}" ${d&&d.type===ty?'selected':''}>${t(ty)}</option>`).join('')}</select>
        <div class="grid grid-cols-2 gap-2">
          <input name="cal" type="number" value="${d?d.cal:''}" placeholder="${t('calories')}" class="border border-slate-200 rounded-xl px-3 py-2.5 text-sm" required>
          <input name="protein" type="number" value="${d?d.protein:''}" placeholder="${t('protein')}" class="border border-slate-200 rounded-xl px-3 py-2.5 text-sm">
          <input name="carbs" type="number" value="${d?d.carbs:''}" placeholder="${t('carbs')}" class="border border-slate-200 rounded-xl px-3 py-2.5 text-sm">
          <input name="fat" type="number" value="${d?d.fat:''}" placeholder="${t('fat')}" class="border border-slate-200 rounded-xl px-3 py-2.5 text-sm">
        </div>
        <div class="flex gap-2 pt-1"><button type="button" onclick="closeModal()" class="flex-1 border border-slate-200 rounded-xl py-2.5 text-sm font-medium">${t('cancel')}</button>
        <button class="flex-1 bg-emerald-500 text-white rounded-xl py-2.5 text-sm font-semibold">${t('save')}</button></div>
      </form>
    </div></div>`;
}
function closeModal(){ state.modal=null; render(); }
function submitMealForm(ev){
  ev.preventDefault(); const f=ev.target; const m=state.modal.data;
  const payload={name:f.name.value.trim(),type:f.type.value,cal:+f.cal.value||0,protein:+f.protein.value||0,carbs:+f.carbs.value||0,fat:+f.fat.value||0};
  if(m) updateMeal(m.id,payload); else addMeal({...payload,date:todayStr(),time:new Date().toTimeString().slice(0,5)});
  return false;
}
function submitWeight(ev){ ev.preventDefault(); const f=ev.target; addWeight(f.kg.value,f.date.value); return false; }

/* ---------- boot ---------- */
async function boot(){
  render();
  if(CONFIGURED && sb){
    const {data:{session}} = await sb.auth.getSession();
    if(session && session.user){ await afterAuth(session.user); }
    sb.auth.onAuthStateChange((event)=>{ if(event==='SIGNED_OUT'){ state.user=null; state.data=null; render(); } });
  }
  state.booting=false;
  render();
}
boot();
</script>
</body>
</html>
